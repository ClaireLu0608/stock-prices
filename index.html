<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟盘 · $10,000 六个月</title>
<style>
/* 配色经过色盲可辨性校验（OKLab ΔE），涨跌另配 ▲▼ 符号，不单靠颜色传达信息 */
:root{
  --ground:#F7F6F3; --surface:#FFF; --sunken:#F0EEE8; --ink:#1A1A17;
  --muted:#6E6C64; --faint:#949187; --hairline:#E2E0D9; --grid:#EDEBE4;
  --accent:#0F588A; --up:#47A05F; --down:#A81800;
  --s-us:#0F588A; --s-voo:#8A5BB5; --s-qqq:#9A7B18;
  --shadow:0 1px 2px rgba(26,26,23,.05),0 4px 16px -8px rgba(26,26,23,.12);
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ground:#14161A; --surface:#1C1F26; --sunken:#23272F; --ink:#E9E7E1;
  --muted:#93918A; --faint:#6E6C66; --hairline:#2C3038; --grid:#252A32;
  --accent:#276A9D; --up:#4DA765; --down:#BA2E16;
  --s-us:#5C95CE; --s-voo:#C55E9E; --s-qqq:#977A20;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px -8px rgba(0,0,0,.6);
}}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.65;margin:0;padding:26px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h2{text-wrap:balance;margin:0}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.masthead h1{font-size:19px;font-weight:650}
.masthead .sub{color:var(--muted);font-size:13px;margin:3px 0 0}
.sec{display:flex;flex-direction:column;gap:11px}
.sec>h2{font-size:15px;font-weight:650}
.sec>.note{font-size:12.5px;color:var(--muted);margin:-3px 0 2px}

.banner{border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.6;
  border:1px solid var(--down);background:var(--sunken);color:var(--ink)}
.banner b{color:var(--down)}
.banner.ok{border-color:var(--hairline)}

.hero{background:var(--surface);border:1px solid var(--hairline);border-radius:4px;
  padding:22px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.hero .val{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:clamp(36px,10.5vw,50px);font-weight:600;line-height:1;letter-spacing:-.035em}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--mono);
  font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;padding:3px 9px;
  border-radius:3px;background:var(--sunken);white-space:nowrap}
.chip .l{font-family:var(--sans);font-weight:500;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

.gauge{display:flex;flex-direction:column;gap:8px}
.gauge .track{position:relative;height:9px;border-radius:2px;background:var(--sunken);border:1px solid var(--hairline)}
.gauge .fill{position:absolute;inset:0 auto 0 0;border-radius:2px 0 0 2px;background:var(--accent)}
.gauge .scale{position:relative;height:28px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.gauge .scale span{position:absolute;top:0;white-space:nowrap;line-height:1.3}
.gauge .scale b{display:block;font-family:var(--sans);font-weight:500;font-size:10px;color:var(--faint)}
.gauge .foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.gauge .foot .num{color:var(--ink);font-weight:600}

.card{background:var(--surface);border:1px solid var(--hairline);border-radius:4px;padding:14px 15px}
.chartbox{background:var(--surface);border:1px solid var(--hairline);border-radius:4px;padding:12px 10px 8px}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:13px;padding:9px 4px 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:15px;border-top:2.5px solid;flex-shrink:0}

.holds{display:grid;gap:10px}
@media(min-width:700px){.holds{grid-template-columns:1fr 1fr}}
.pos{background:var(--surface);border:1px solid var(--hairline);border-radius:4px;
  padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.pos .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pos .sym{font-family:var(--mono);font-size:14px;font-weight:650;letter-spacing:.02em}
.pos .co{font-size:12.5px;color:var(--muted)}
.pos .pl{text-align:right;flex-shrink:0}
.pos .pl .a{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;display:block}
.pos .pl .p{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px}
.pos dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:0;font-size:12.5px}
.pos dt{color:var(--muted)}
.pos dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:550}
.bar{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.cap .num{color:var(--ink);font-weight:600}
.safety{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--up)}
.dot.warn{background:var(--accent)} .dot.risk{background:var(--down)}

.scroller{overflow-x:auto;border:1px solid var(--hairline);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--hairline)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
tbody td{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody td:first-child,td.txt{font-family:var(--sans)}
tbody tr:last-child td{border-bottom:none}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px}

.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--hairline)}
.tl li:last-child{border-bottom:none}
.tl .d{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px}
.tl .act{font-size:13.5px;font-weight:600}
.tl .act .num{font-family:var(--mono)}
.tl .why{font-size:12.5px;color:var(--muted);line-height:1.55;margin:4px 0 0}
.buy{color:var(--up);font-weight:650} .sell{color:var(--down);font-weight:650}

footer{font-size:11.5px;color:var(--faint);line-height:1.7;border-top:1px solid var(--hairline);padding-top:13px}
#loading{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Paper Trading · 模拟盘</p>
    <h1>$10,000 六个月挑战</h1>
    <p class="sub" id="sub">载入中…</p>
  </header>
  <div id="loading">正在读取账本和最新价格…</div>
  <div id="app" hidden></div>
</div>

<script>
const REPO_RAW = '.';                       // 与数据同目录，同源读取
const fmt  = v => '$' + v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct  = v => (v>=0?'+':'') + v.toFixed(2) + '%';
const sign = v => v>0 ? 'up' : v<0 ? 'down' : 'flat';
const arrow= v => v>0 ? '▲' : v<0 ? '▼' : '±';
const esc  = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(f){
  // 加时间戳防止浏览器缓存旧数据 —— 看板的意义就是永远显示最新
  const r = await fetch(`${REPO_RAW}/${f}?t=${Date.now()}`);
  if(!r.ok) throw new Error(`${f} 读取失败（HTTP ${r.status}）`);
  return r.json();
}

function chart(curve, live){
  const START=Date.UTC(2026,7,18), END=Date.UTC(2027,1,19), LO=9100, HI=11200;
  const W=660,H=250,ML=52,MR=54,MT=12,MB=28,PW=W-ML-MR,PH=H-MT-MB;
  const x=t=>ML+(t-START)/(END-START)*PW, y=v=>MT+(HI-v)/(HI-LO)*PH;
  const pts=curve.map(r=>({t:Date.parse(r.date+'T00:00:00Z'),us:r.net_worth,voo:r.voo_value,qqq:r.qqq_value}));
  if(live) pts.push(live);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="净值与 VOO、QQQ 基准走势对比">`;
  for(const g of [{v:11000,l:'目标',d:1},{v:10000,l:'起点',d:0},{v:9200,l:'熔断',d:1}]){
    s+=`<line x1="${ML}" x2="${ML+PW}" y1="${y(g.v)}" y2="${y(g.v)}" stroke="var(--${g.d?'faint':'ink'})"
        stroke-width="1" stroke-dasharray="${g.d?'3 3':'0'}" stroke-opacity="${g.d?.75:.35}"/>
        <text x="${ML-8}" y="${y(g.v)+3.5}" text-anchor="end" fill="var(--faint)" font-size="10"
        font-family="var(--mono)">$${g.v.toLocaleString('en-US')}</text>`;
  }
  for(const [t,l] of [[Date.UTC(2026,7,18),'8/18'],[Date.UTC(2026,9,1),'10/1'],
      [Date.UTC(2026,10,15),'11/15'],[Date.UTC(2027,0,1),'1/1'],[Date.UTC(2027,1,19),'2/19']])
    s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${MT}" y2="${MT+PH}" stroke="var(--grid)" stroke-width="1"/>
        <text x="${x(t)}" y="${MT+PH+17}" text-anchor="middle" fill="var(--faint)" font-size="10"
        font-family="var(--mono)">${l}</text>`;
  // 两个中途总复盘节点
  for(const [t,l] of [[Date.UTC(2026,9,19),'复盘①'],[Date.UTC(2026,11,9),'复盘②']])
    s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${MT}" y2="${MT+PH}" stroke="var(--accent)" stroke-width="1"
        stroke-dasharray="4 3" stroke-opacity=".55"/>
        <text x="${x(t)+4}" y="${MT+11}" fill="var(--accent)" font-size="9.5" font-weight="600">${l}</text>`;
  // 虚线样式是第二重编码：暗色模式下蓝/品红在色盲模拟里区分度处于警戒带
  const SER=[{k:'qqq',c:'--s-qqq',d:'1 4',n:'QQQ'},{k:'voo',c:'--s-voo',d:'5 4',n:'VOO'},{k:'us',c:'--s-us',d:'0',n:'我们'}];
  SER.forEach((se,i)=>{
    if(pts.length>1) s+=`<path d="${pts.map((p,j)=>(j?'L':'M')+x(p.t).toFixed(1)+' '+y(p[se.k]).toFixed(1)).join(' ')}"
      fill="none" stroke="var(${se.c})" stroke-width="2" stroke-dasharray="${se.d}" stroke-linejoin="round"/>`;
    const L=pts[pts.length-1], dy=pts.length===1?(i-1)*13:0;
    s+=`<circle cx="${x(L.t)}" cy="${y(L[se.k])}" r="4.5" fill="var(${se.c})" stroke="var(--surface)" stroke-width="2"/>
        <text x="${x(L.t)+10}" y="${y(L[se.k])+3.5+dy}" fill="var(${se.c})" font-size="11" font-weight="650">${se.n}</text>`;
  });
  return s+'</svg>';
}

(async ()=>{
  const app=document.getElementById('app'), loading=document.getElementById('loading');
  let L,P;
  try{ [L,P] = await Promise.all([load('ledger.json'), load('prices.json')]); }
  catch(e){
    loading.innerHTML=`<div class="banner"><b>⚠️ 数据读取失败</b><br>${esc(e.message)}<br>
      稍后重试；若持续失败，检查 GitHub Actions 是否还在运行。</div>`;
    return;
  }

  const Q=P.quotes, out=[];
  const ageMin=(Date.now()/1000 - P.fetched_at_unix)/60;

  // ── 与机器人同一套防御：数据陈旧、持仓缺失都要大声报出来，绝不静默算错 ──
  const missing=L.positions.filter(p=>!Q[p.ticker]).map(p=>p.ticker);
  if(missing.length) out.push(`<div class="banner"><b>⚠️ 持仓 ${missing.join('、')} 不在价格文件里</b><br>
    净值无法计算。需把它加进 <code>fetch_prices.py</code> 的 SYMBOLS 列表。</div>`);
  else if(ageMin>120) out.push(`<div class="banner"><b>⚠️ 价格已过期</b><br>
    最后更新于 ${Math.round(ageMin)} 分钟前（${esc(P.fetched_at_utc)}）。下面的数字仅供参考，请检查 GitHub Actions。</div>`);

  if(missing.length){ loading.hidden=true; app.hidden=false; app.innerHTML=out.join(''); return; }

  // ── 计算 ──
  const rows=L.positions.map(p=>{
    const now=Q[p.ticker].price, mv=p.shares*now, pl=p.shares*(now-p.cost);
    return {...p, now, mv, pl, plPct:(now/p.cost-1)*100, toStop:(now/p.stop_loss-1)*100};
  });
  const mv=rows.reduce((a,r)=>a+r.mv,0), cash=L.cash, net=mv+cash;
  const init=L.meta.initial_capital;
  const bench=Object.fromEntries(Object.entries(L.benchmarks).map(([k,v])=>[k, v.shares*Q[k].price]));
  const netPct=(net/init-1)*100, vooPct=(bench.VOO/init-1)*100, qqqPct=(bench.QQQ/init-1)*100;
  const prev=L.equity_curve.length?L.equity_curve[L.equity_curve.length-1].net_worth:init;
  const dayChg=net-prev, dayPct=(net/prev-1)*100;
  const daysLeft=Math.max(0,Math.ceil((Date.parse(L.meta.end_date)-Date.now())/864e5));
  const gaugePos=Math.max(0,Math.min(100,(net-L.meta.circuit_breaker)/(L.meta.stretch_target-L.meta.circuit_breaker)*100));

  document.getElementById('sub').textContent =
    `${L.meta.start_date} 开始 → ${L.meta.end_date} 结束｜价格截至 ${P.fetched_at_utc}（${Math.round(ageMin)} 分钟前）`;

  out.push(`<section class="hero">
    <div><p class="eyebrow">总资产</p>
      <div class="val ${sign(netPct)}">${fmt(net)}</div>
      <div class="chips" style="margin-top:7px">
        <span class="chip ${sign(dayChg)}"><span class="l">今天</span>${arrow(dayChg)}${fmt(Math.abs(dayChg))}</span>
        <span class="chip ${sign(netPct)}"><span class="l">累计</span>${pct(netPct)}</span>
        <span class="chip ${sign(netPct-vooPct)}"><span class="l">vs VOO</span>${pct(netPct-vooPct)}</span>
        <span class="chip"><span class="l">现金</span>${fmt(cash)}</span>
      </div></div>
    <div class="gauge"><p class="eyebrow">距离目标</p>
      <div class="track"><span class="fill" style="width:${gaugePos}%"></span></div>
      <div class="scale">
        <span style="left:0">$9,200<b>熔断线</b></span>
        <span style="left:44.4%;transform:translateX(-50%)">$10,000<b>起点</b></span>
        <span style="right:0;text-align:right">$11,000<b>目标</b></span></div>
      <div class="foot"><span>还差 <span class="num">${fmt(Math.max(0,L.meta.stretch_target-net))}</span></span>
        <span>还剩 <span class="num">${daysLeft}</span> 天</span></div>
    </div></section>`);

  const liveDate=new Date().toISOString().slice(0,10);
  const hasToday=L.equity_curve.some(r=>r.date===liveDate);
  out.push(`<section class="sec"><h2>六个月走势</h2>
    <p class="note">三条线都从 $10,000 起跑。真正的问题不是"我们赚了没"，而是"有没有赢过什么都不做"。</p>
    <div class="chartbox">${chart(L.equity_curve, hasToday?null:{t:Date.now(),us:net,voo:bench.VOO,qqq:bench.QQQ})}</div>
    <div class="legend"><span><i style="border-color:var(--s-us)"></i>我们的组合</span>
      <span><i style="border-color:var(--s-voo);border-top-style:dashed"></i>VOO（整个大盘）</span>
      <span><i style="border-color:var(--s-qqq);border-top-style:dotted"></i>QQQ（科技股）</span></div></section>`);

  out.push(`<section class="sec"><h2>我们 vs 大盘</h2><div class="scroller"><table>
    <thead><tr><th>　</th><th>现在</th><th>累计</th></tr></thead><tbody>
    <tr><td><i class="sw" style="background:var(--s-us)"></i>我们的组合</td><td>${fmt(net)}</td>
      <td class="txt"><span class="chip ${sign(netPct)}">${pct(netPct)}</span></td></tr>
    <tr><td><i class="sw" style="background:var(--s-voo)"></i>VOO</td><td>${fmt(bench.VOO)}</td>
      <td class="txt"><span class="chip ${sign(vooPct)}">${pct(vooPct)}</span></td></tr>
    <tr><td><i class="sw" style="background:var(--s-qqq)"></i>QQQ</td><td>${fmt(bench.QQQ)}</td>
      <td class="txt"><span class="chip ${sign(qqqPct)}">${pct(qqqPct)}</span></td></tr>
    </tbody></table></div>
    <p class="note"><b>跑赢 VOO 是硬标准。</b>只赚钱不算数——我们赚 4% 而 VOO 赚 7%，这半年的分析就是白费力气。</p></section>`);

  out.push(`<section class="sec"><h2>手里现在有什么</h2><div class="holds">` +
    rows.map(r=>{
      const w=r.mv/net*100, lvl=r.toStop<2?'risk':r.toStop<5?'warn':'';
      return `<article class="pos"><div class="top">
        <div><span class="sym">${esc(r.ticker)}</span><br><span class="co">${esc(r.name)}</span></div>
        <div class="pl ${sign(r.pl)}"><span class="a">${arrow(r.pl)}${fmt(Math.abs(r.pl))}</span>
          <span class="p">${pct(r.plPct)}</span></div></div>
        <p class="co" style="margin:0;padding-bottom:8px;border-bottom:1px solid var(--hairline)">${esc(r.reason)}</p>
        <dl><dt>持有</dt><dd>${r.shares} 股</dd><dt>成本</dt><dd>${fmt(r.cost)}</dd>
          <dt>现价</dt><dd>${fmt(r.now)}</dd><dt>市值</dt><dd>${fmt(r.mv)}</dd></dl>
        <div><div class="bar"><i style="width:${w.toFixed(1)}%"></i></div>
          <div class="cap"><span>占总资产</span><span class="num">${w.toFixed(1)}%</span></div></div>
        <p class="safety"><span class="dot ${lvl}"></span>离止损线 ${fmt(r.stop_loss)} 还有
          <span class="num" style="color:var(--ink);font-weight:600">${r.toStop.toFixed(1)}%</span></p>
      </article>`;}).join('') +
    `<article class="pos"><div class="top"><div><span class="sym">CASH</span><br><span class="co">现金（子弹）</span></div>
      <div class="pl flat"><span class="a">${fmt(cash)}</span></div></div>
      <p class="co" style="margin:0">留着等事件密集期。中东、财报、FOMC 随时可能给出更好的价格。</p>
      <div><div class="bar"><i style="width:${(cash/net*100).toFixed(1)}%"></i></div>
        <div class="cap"><span>占总资产</span><span class="num">${(cash/net*100).toFixed(1)}%</span></div></div>
    </article></div></section>`);

  // ── 板块热力：钱在往哪个行业流 ──
  const SECT=[['XLE','能源'],['XLK','科技'],['XLF','金融'],['XLV','医疗'],['XLU','公用事业'],['XLP','必需消费'],
              ['XLY','可选消费'],['XLI','工业'],['XLB','材料'],['XLRE','房地产'],['XLC','通讯服务']]
    .filter(([t])=>Q[t]).map(([t,n])=>({t,n,c:Q[t].change_pct})).sort((a,b)=>b.c-a.c);
  if(SECT.length) out.push(`<section class="sec"><h2>钱今天流向哪个行业</h2>
    <p class="note">11 个行业指数，按今天涨跌排序。<b>排最上和最下的差距越大，说明轮动越剧烈。</b></p>
    <div class="scroller"><table><tbody>` + SECT.map(s=>`<tr><td>${s.n}<span class="co"> ${s.t}</span></td>
      <td class="${sign(s.c)}">${arrow(s.c)} ${pct(s.c)}</td></tr>`).join('') + `</tbody></table></div></section>`);

  const MACRO=[['TLT','20年期国债','利息涨它就跌，是利率的镜子'],['SHY','短期国债','和 TLT 一比就是收益率曲线'],
    ['GLD','黄金','避险情绪'],['USO','原油','直接影响我们的石油仓位'],
    ['IWM','小盘股','对利率最敏感'],['HYG','垃圾债','市场压力的早期警报'],['UUP','美元','涨则大宗商品承压']]
    .filter(([t])=>Q[t]);
  if(MACRO.length) out.push(`<section class="sec"><h2>宏观风向</h2><div class="scroller"><table>
    <tbody>` + MACRO.map(([t,n,d])=>`<tr><td>${n}<span class="co"> ${t}</span><br>
      <span class="co" style="font-size:11px">${d}</span></td>
      <td class="${sign(Q[t].change_pct)}">${arrow(Q[t].change_pct)} ${pct(Q[t].change_pct)}</td></tr>`).join('') +
    `</tbody></table></div></section>`);

  out.push(`<section class="sec"><h2>做过的每一笔</h2>
    <p class="note">每笔都记着当时的理由。半年后回头看，才知道哪些判断对、哪些错。</p>
    <ol class="tl">` + [...L.trades].reverse().map(t=>`<li>
      <span class="d">${esc(t.date.slice(5))}${t.time_et?'<br>'+esc(t.time_et):''}</span>
      <div><span class="act"><span class="${t.action==='BUY'?'buy':'sell'}">${t.action==='BUY'?'买入':'卖出'}</span>
        ${esc(t.ticker)} · <span class="num">${t.shares} 股 @ ${fmt(t.price)}</span></span>
        <p class="why">${esc(t.reason||'')}</p></div></li>`).join('') + `</ol></section>`);

  out.push(`<footer>▲ 绿色表示赚、▼ 红色表示亏（按美股习惯），涨跌同时标出符号与数值，不单靠颜色区分。<br>
    数据每 20–30 分钟自动更新，页面每次打开都重新计算。账本最后更新于 ${esc(L.last_updated_utc||'—')}（${esc(L.last_updated_by||'—')}）。<br>
    这是模拟盘学习记录，<b>不是真钱，也不构成投资建议</b>。</footer>`);

  loading.hidden=true; app.hidden=false; app.innerHTML=out.join('');
})();
</script>
</body>
</html>
