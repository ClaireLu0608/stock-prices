<style>
:root{--ground:#F7F6F3;--surface:#FFF;--ink:#1A1A17;--muted:#6E6C64;--faint:#949187;
  --hairline:#E2E0D9;--accent:#0F588A;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--ground:#14161A;--surface:#1C1F26;--ink:#E9E7E1;
  --muted:#93918A;--faint:#6E6C66;--hairline:#2C3038;--accent:#5C95CE}}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:12px;
  padding:34px 30px;max-width:440px;width:100%;line-height:1.7}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);margin:0 0 10px}
h1{font-size:21px;font-weight:660;margin:0 0 14px;letter-spacing:-.02em}
p{margin:0 0 14px;font-size:14px;color:var(--muted)}
a.go{display:block;margin:20px 0 0;padding:14px 16px;background:var(--accent);color:#fff;
  text-decoration:none;border-radius:9px;text-align:center;font-weight:640;font-size:15px}
code{font-family:var(--mono);font-size:12.5px;background:var(--ground);
  padding:2px 6px;border-radius:4px;color:var(--ink);word-break:break-all}
.note{font-size:12.5px;color:var(--faint);margin:18px 0 0;padding-top:14px;
  border-top:1px solid var(--hairline)}
</style>
